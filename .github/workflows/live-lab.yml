name: Native Live Lab
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "native/live-lab/**"
      - "scripts/build-live-lab-helper.sh"
      - ".github/workflows/live-lab.yml"
permissions:
  contents: read
jobs:
  macos-helper:
    name: macOS native helper (no devices)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test bounded audio rings
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined native/live-lab/AudioCore.c native/live-lab/test-core.c -o /tmp/live-lab-core-test
          /tmp/live-lab-core-test
      - name: Compile Apple voice-processing helper and self-test
        run: sh scripts/build-live-lab-helper.sh
      - name: Device-free protocol smoke
        run: |
          dist/live-lab-audio --help
          printf '{"type":"stop"}\n' | dist/live-lab-audio
      - uses: actions/upload-artifact@v4
        with:
          name: live-lab-audio-macos-arm64-experimental
          path: dist/live-lab-audio
          if-no-files-found: error
          retention-days: 7
