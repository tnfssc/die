name: Release

on:
  workflow_dispatch:
  push:
    branches: [develop]
    tags:
      - "v*"

permissions:
  contents: read

# Serialize manual requests; tag creation additionally checks the remote ref atomically.
concurrency:
  group: release-manual-${{ github.event_name == 'workflow_dispatch' && 'develop' || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare-manual:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - id: prepare
        name: Prepare next release on latest develop
        shell: bash
        run: |
          set -euo pipefail
          workflow_sha=$(git rev-parse HEAD:.github/workflows/release.yml)
          git fetch origin develop --tags
          git checkout -B release origin/develop
          test "$(git rev-parse HEAD:.github/workflows/release.yml)" = "$workflow_sha" || { echo "Release workflow changed since dispatch; retry from latest develop"; exit 1; }
          tag=$(bun scripts/prepare-manual-release.ts)
          git add package.json "support/release-$tag.md"
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Prepare $tag release"
            git push origin HEAD:refs/heads/develop
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Prepared $tag at $(git rev-parse HEAD); publication waits for all release gates." >> "$GITHUB_STEP_SUMMARY"

  reuse-check:
    name: Find successful develop dry run at tag commit
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.lookup.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - id: lookup
        name: Look up verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(bun scripts/find-release-dry-run.ts)
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          if [[ -z "$run_id" ]]; then echo 'No verified develop dry run; full release gates will run.'; fi

  mac-helper:
    name: Native macOS arm64 helper (no devices)
    runs-on: macos-15
    timeout-minutes: 10
    needs: [reuse-check, prepare-manual]
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || needs.prepare-manual.result == 'success') && (github.ref == 'refs/heads/develop' || (github.event_name == 'push' && !contains(github.ref_name, '-'))) && (needs.reuse-check.result == 'skipped' || (needs.reuse-check.result == 'success' && needs.reuse-check.outputs.run_id == '')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-manual.outputs.sha || github.sha }}
      - name: Sanitized, device-free native ring tests
        shell: bash
        run: |
          xcrun clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined native/live/AudioCore.c native/live/test-core.c -o /tmp/live-core-test
          /tmp/live-core-test
      - name: Compile helper and check device-free protocol
        shell: bash
        run: |
          scripts/build-live-helper.sh
          file dist/live-audio | grep -E 'Mach-O 64-bit (executable arm64|arm64 executable)'
          dist/live-audio --self-test
          python3 - <<'PY'
          import json, select, subprocess
          p = subprocess.Popen(['dist/live-audio'], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
          try:
              assert select.select([p.stdout], [], [], 5)[0], 'helper hello timed out'
              assert json.loads(p.stdout.readline()) == {'type': 'hello', 'protocol': 1}
          finally:
              p.terminate()
              p.wait(timeout=5)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-mac-arm64-helper
          path: dist/live-audio
          if-no-files-found: error
          retention-days: 2
  release:
    # Develop runs the same gates without publishing; prerelease tags stay excluded.
    needs: [reuse-check, prepare-manual, mac-helper]
    if: ${{ always() && (github.ref == 'refs/heads/develop' || (github.event_name == 'push' && !contains(github.ref_name, '-'))) && (github.event_name != 'workflow_dispatch' || needs.prepare-manual.result == 'success') && needs.mac-helper.result == 'success' }}
    name: Linux, macOS, and Android release
    runs-on: ubuntu-24.04
    env:
      RELEASE_SHA: ${{ needs.prepare-manual.outputs.sha || github.sha }}
      RELEASE_TAG: ${{ needs.prepare-manual.outputs.tag || github.ref_name }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-manual.outputs.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.27.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Resolve pinned T3 source checkout
        shell: bash
        run: echo "DIE_T3_SOURCE=$GITHUB_WORKSPACE/.cache/die-t3code-$(bun -e 'console.log(require("./integrations/t3/upstream/source.json").revision)')" >> "$GITHUB_ENV"
      - name: Install required PTY tooling
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Prepare logs
        run: mkdir -p artifacts/release dist/release
      - name: Validate tag matches package version
        shell: bash
        run: |
          tag="$RELEASE_TAG"
          if [[ "$GITHUB_REF" == refs/heads/develop && "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            tag="v$(bun -p 'require("./package.json").version')"
          fi
          bun scripts/validate-release-tag.ts "$tag" 2>&1 | tee artifacts/release/version.log
      - name: Install locked dependencies
        shell: bash
        run: bun install --frozen-lockfile 2>&1 | tee artifacts/release/install.log
      - name: Format check
        shell: bash
        run: bun run format:check 2>&1 | tee artifacts/release/format.log
      - name: Lint
        shell: bash
        run: bun run lint 2>&1 | tee artifacts/release/lint.log
      - name: Typecheck
        shell: bash
        run: bun run check 2>&1 | tee artifacts/release/typecheck.log
      - name: Build compiled test binary
        shell: bash
        run: bun run build 2>&1 | tee artifacts/release/test-build.log
      - name: Deterministic tests
        shell: bash
        env:
          DIE_RUN_LLM_TESTS: "0"
        run: bun test ./tests 2>&1 | tee artifacts/release/tests.log
      - name: Standalone smoke test
        shell: bash
        run: bun run smoke -- --reuse-build 2>&1 | tee artifacts/release/smoke.log
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-mac-arm64-helper
          path: artifacts/release/mac-helper
      - name: Verify native helper from Mac runner
        shell: bash
        run: |
          test -s artifacts/release/mac-helper/live-audio
          file artifacts/release/mac-helper/live-audio | grep -E 'Mach-O 64-bit (executable arm64|arm64 executable)'
      - name: Build release binaries with embedded web application
        shell: bash
        run: |
          bun run build -- --reuse-web --target=bun-linux-x64-baseline --outfile=./dist/release/die-linux-x64 2>&1 | tee artifacts/release/build-linux-x64.log
          test "$(./dist/release/die-linux-x64 --version)" = "$(bun -p 'require("./package.json").version')"
          bun run build -- --reuse-web --target=bun-linux-arm64 --outfile=./dist/release/die-linux-arm64 2>&1 | tee artifacts/release/build-linux-arm64.log
          bun run build -- --reuse-web --live-helper=./artifacts/release/mac-helper/live-audio --target=bun-darwin-arm64 --outfile=./dist/release/die-darwin-arm64 2>&1 | tee artifacts/release/build-darwin-arm64.log
          bun run build -- --reuse-web --target=bun-android-arm64 --outfile=./dist/release/die-android-arm64 2>&1 | tee artifacts/release/build-android-arm64.log
          chmod 0755 ./dist/release/die-linux-x64 ./dist/release/die-linux-arm64 ./dist/release/die-darwin-arm64 ./dist/release/die-android-arm64
      - name: Generate production dependency notices
        shell: bash
        run: bun run generate:notices 2>&1 | tee artifacts/release/notices.log
      - name: Add embedded backend dependency licenses
        shell: bash
        run: |
          {
            printf '\n\nEMBEDDED T3 CODE BACKEND LICENSING\n==================================\n'
            printf '\n--- dist/die-web/LICENSE-T3CODE ---\n'
            cat dist/die-web/LICENSE-T3CODE
            while IFS= read -r -d '' license; do
              printf '\n--- %s ---\n' "$license"
              cat "$license"
            done < <(find dist/die-web/node_modules/.pnpm -type f \
              \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' \) -print0 | sort -z)
          } >> dist/release/THIRD_PARTY_LICENSES.txt
      - name: Document native audio licensing
        shell: bash
        run: |
          printf '\n\nNATIVE LIVE AUDIO HELPER\n============================\n' >> dist/release/THIRD_PARTY_LICENSES.txt
          printf 'The native helper is project source under the repository MIT LICENSE; it links Apple system AVFoundation/CoreFoundation frameworks, not bundled third-party native libraries.\n' >> dist/release/THIRD_PARTY_LICENSES.txt
      - name: Validate web backend
        shell: bash
        run: |
          cd "$DIE_T3_SOURCE/apps/server"
          ../../node_modules/.bin/tsc --noEmit 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/release/web-typecheck.log"
          ../../node_modules/.bin/vp test run src/provider/Layers/PiProvider.test.ts src/auth/EnvironmentAuth.test.ts src/serverRuntimeStartup.test.ts src/terminal/NodePtyAdapter.test.ts src/terminal/BunPtyAdapter.test.ts src/device/AgentDeviceTarget.test.ts src/provider/Layers/EventNdjsonLogger.test.ts src/terminal/SubscriberStream.test.ts 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/release/web-tests.log"
      - name: Validate web cache regressions
        shell: bash
        run: |
          cd "$DIE_T3_SOURCE/apps/web"
          ../../node_modules/.bin/tsc --noEmit 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/release/web-client-typecheck.log"
          ../../node_modules/.bin/vp test run src/lib/syntaxHighlighting.test.ts src/components/pullRequest/pullRequestDetail.logic.test.ts src/components/chat/nativeUsageCost.logic.test.ts 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/release/web-cache-tests.log"
      - name: Validate terminal client recovery
        shell: bash
        run: |
          cd "$DIE_T3_SOURCE/packages/client-runtime"
          ../../node_modules/.bin/tsc --noEmit 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/release/terminal-client-typecheck.log"
          ../../node_modules/.bin/vp test run src/rpc/client.test.ts src/state/terminalSession.test.ts 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/release/terminal-client-tests.log"
      - name: Create checksums and source information
        shell: bash
        run: |
          cd dist/release
          sha256sum die-linux-x64 > die-linux-x64.sha256
          sha256sum die-linux-arm64 > die-linux-arm64.sha256
          sha256sum die-darwin-arm64 > die-darwin-arm64.sha256
          sha256sum die-android-arm64 > die-android-arm64.sha256
          cp ../../LICENSE ../../THIRD_PARTY_NOTICES.md .
          t3_revision=$(bun -e 'console.log(require("../../integrations/t3/upstream/source.json").revision)')
          patch_sha256=$(sha256sum ../../integrations/t3/upstream/die.patch | awk '{print $1}')
          source_ref="$RELEASE_TAG"
          # A develop pretag dry run stages exactly the metadata the tag will publish.
          if [[ "$GITHUB_REF" == refs/heads/develop ]]; then
            source_ref="v$(bun -p 'require("../../package.json").version')"
          fi
          printf 'Source: https://github.com/%s/tree/%s\nCommit: %s\nTag: %s\nTargets:\n- bun-linux-x64-baseline -> die-linux-x64\n- bun-linux-arm64 -> die-linux-arm64\n- bun-darwin-arm64 -> die-darwin-arm64\n- bun-android-arm64 -> die-android-arm64\n\nEmbedded T3 Code source: https://github.com/pingdotgg/t3code/tree/%s\nRevision: %s\nPatch: integrations/t3/upstream/die.patch\nPatch-SHA256: %s\n' \
            "$GITHUB_REPOSITORY" "$RELEASE_SHA" "$RELEASE_SHA" "$source_ref" \
            "$t3_revision" "$t3_revision" "$patch_sha256" > SOURCE.txt
          printf '\nEmbedded macOS arm64 native helper (Apple frameworks; experimental voice-only /live):\n' >> SOURCE.txt
          sha256sum ../../artifacts/release/mac-helper/live-audio >> SOURCE.txt
      - name: Verify old updater with actual Linux release binary
        run: bun scripts/verify-v071-update.ts dist/release/die-linux-x64 "$(bun -p 'require("./package.json").version')"
      - name: Stage verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-release-assets
          path: dist/release/
          if-no-files-found: error
          retention-days: 7
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-failure-logs
          path: artifacts/release/
          if-no-files-found: warn
          retention-days: 14

  reuse-assets:
    name: Stage assets from verified develop dry run
    if: ${{ needs.reuse-check.outputs.run_id != '' }}
    needs: reuse-check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stable-release-assets
          run-id: ${{ needs.reuse-check.outputs.run_id }}
          github-token: ${{ github.token }}
          path: dist/release
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Validate tag matches package version
        run: bun scripts/validate-release-tag.ts "$GITHUB_REF_NAME"
      - name: Verify downloaded staged files
        shell: bash
        run: |
          cd dist/release
          grep -Fx "Commit: $GITHUB_SHA" SOURCE.txt
          grep -Fx "Tag: $GITHUB_REF_NAME" SOURCE.txt
          for binary in die-linux-x64 die-linux-arm64 die-darwin-arm64 die-android-arm64; do
            test -s "$binary"
            test -s "$binary.sha256"
            sha256sum --check --strict "$binary.sha256"
          done
          for file in LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.txt SOURCE.txt; do test -s "$file"; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-release-assets
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  mac-release-smoke:
    name: Actual Mac release binary and old updater (no devices)
    needs: [release, reuse-assets, prepare-manual]
    if: ${{ always() && (needs.release.result == 'success' || needs.reuse-assets.result == 'success') }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-manual.outputs.sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stable-release-assets
          path: dist/release
      - name: Exercise installed-stable updater and embedded helper
        shell: bash
        run: |
          chmod 0755 dist/release/die-darwin-arm64
          bun scripts/verify-v071-update.ts dist/release/die-darwin-arm64 "$(bun -p 'require("./package.json").version')"
          home=$(mktemp -d)
          trap 'rm -rf "$home"' EXIT
          cd "$home"
          env -i HOME="$home" PATH=/usr/bin:/bin "$GITHUB_WORKSPACE/dist/release/die-darwin-arm64" --live-self-test

  publish:
    name: Publish stable release after native and updater gates
    needs: [release, reuse-assets, mac-release-smoke, prepare-manual]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' && needs.prepare-manual.result == 'success' || github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && needs.mac-release-smoke.result == 'success' && (needs.release.result == 'success' || needs.reuse-assets.result == 'success') }}
    runs-on: ubuntu-24.04
    env:
      RELEASE_SHA: ${{ needs.prepare-manual.outputs.sha || github.sha }}
      RELEASE_TAG: ${{ needs.prepare-manual.outputs.tag || github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-manual.outputs.sha || github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stable-release-assets
          path: dist/release
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes_file=$(bun scripts/select-release-notes.ts "$RELEASE_TAG")
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            # No workflow starts from a GITHUB_TOKEN tag push; publish here after gates.
            git fetch origin develop --tags
            test "$(git rev-parse origin/develop)" = "$RELEASE_SHA" || { echo 'develop advanced during verification; refusing stale publication'; exit 1; }
            if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
              echo 'Release tag already exists; refusing duplicate publication'; exit 1
            fi
            git push origin "$RELEASE_SHA:refs/tags/$RELEASE_TAG"
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --generate-notes \
            --notes-file "$notes_file" \
            --title "$RELEASE_TAG" \
            dist/release/die-linux-x64 \
            dist/release/die-linux-x64.sha256 \
            dist/release/die-linux-arm64 \
            dist/release/die-linux-arm64.sha256 \
            dist/release/die-darwin-arm64 \
            dist/release/die-darwin-arm64.sha256 \
            dist/release/die-android-arm64 \
            dist/release/die-android-arm64.sha256 \
            dist/release/LICENSE \
            dist/release/THIRD_PARTY_NOTICES.md \
            dist/release/THIRD_PARTY_LICENSES.txt \
            dist/release/SOURCE.txt
          echo "Published $RELEASE_TAG from $RELEASE_SHA with verified release assets." >> "$GITHUB_STEP_SUMMARY"
