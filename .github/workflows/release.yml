name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    # Prereleases use explicit candidate bundles (including native helpers), not stable assets.
    if: ${{ !contains(github.ref_name, '-') }}
    name: Linux, macOS, and Android release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - name: Resolve pinned T3 source checkout
        shell: bash
        run: echo "DIE_T3_SOURCE=$GITHUB_WORKSPACE/.cache/die-t3code-$(bun -e 'console.log(require("./web/t3-source.json").revision)')" >> "$GITHUB_ENV"
      - name: Install required PTY tooling
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Prepare logs
        run: mkdir -p artifacts/release dist/release
      - name: Validate tag matches package version
        shell: bash
        run: bun scripts/validate-release-tag.ts "$GITHUB_REF_NAME" 2>&1 | tee artifacts/release/version.log
      - name: Install locked dependencies
        shell: bash
        run: bun install --frozen-lockfile 2>&1 | tee artifacts/release/install.log
      - name: Format check
        shell: bash
        run: bun run format:check 2>&1 | tee artifacts/release/format.log
      - name: Lint
        shell: bash
        run: bun run lint 2>&1 | tee artifacts/release/lint.log
      - name: Typecheck
        shell: bash
        run: bun run check 2>&1 | tee artifacts/release/typecheck.log
      - name: Build compiled test binary
        shell: bash
        run: bun run build 2>&1 | tee artifacts/release/test-build.log
      - name: Deterministic tests
        shell: bash
        env:
          DIE_RUN_LLM_TESTS: "0"
        run: bun test ./tests 2>&1 | tee artifacts/release/tests.log
      - name: Standalone smoke test
        shell: bash
        run: bun run smoke 2>&1 | tee artifacts/release/smoke.log
      - name: Build release binaries with embedded web application
        shell: bash
        run: |
          bun run build -- --reuse-web --target=bun-linux-x64-baseline --outfile=./dist/release/die-linux-x64 2>&1 | tee artifacts/release/build-linux-x64.log
          test "$(./dist/release/die-linux-x64 --version)" = "${GITHUB_REF_NAME#v}"
          bun run build -- --reuse-web --target=bun-linux-arm64 --outfile=./dist/release/die-linux-arm64 2>&1 | tee artifacts/release/build-linux-arm64.log
          bun run build -- --reuse-web --target=bun-darwin-arm64 --outfile=./dist/release/die-darwin-arm64 2>&1 | tee artifacts/release/build-darwin-arm64.log
          bun run build -- --reuse-web --target=bun-android-arm64 --outfile=./dist/release/die-android-arm64 2>&1 | tee artifacts/release/build-android-arm64.log
          chmod 0755 ./dist/release/die-linux-x64 ./dist/release/die-linux-arm64 ./dist/release/die-darwin-arm64 ./dist/release/die-android-arm64
      - name: Generate production dependency notices
        shell: bash
        run: bun run generate:notices 2>&1 | tee artifacts/release/notices.log
      - name: Add embedded backend dependency licenses
        shell: bash
        run: |
          {
            printf '\n\nEMBEDDED T3 CODE BACKEND LICENSING\n==================================\n'
            printf '\n--- dist/die-web/LICENSE-T3CODE ---\n'
            cat dist/die-web/LICENSE-T3CODE
            while IFS= read -r -d '' license; do
              printf '\n--- %s ---\n' "$license"
              cat "$license"
            done < <(find dist/die-web/node_modules/.pnpm -type f \
              \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' \) -print0 | sort -z)
          } >> dist/release/THIRD_PARTY_LICENSES.txt
      - name: Validate web backend
        shell: bash
        run: |
          cd "$DIE_T3_SOURCE/apps/server"
          ../../node_modules/.bin/tsc --noEmit 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/release/web-typecheck.log"
          ../../node_modules/.bin/vp test run src/provider/Layers/PiProvider.test.ts src/auth/EnvironmentAuth.test.ts src/serverRuntimeStartup.test.ts src/terminal/NodePtyAdapter.test.ts src/terminal/BunPtyAdapter.test.ts src/device/AgentDeviceTarget.test.ts src/provider/Layers/EventNdjsonLogger.test.ts src/terminal/SubscriberStream.test.ts 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/release/web-tests.log"
      - name: Validate web cache regressions
        shell: bash
        run: |
          cd "$DIE_T3_SOURCE/apps/web"
          ../../node_modules/.bin/tsc --noEmit 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/release/web-client-typecheck.log"
          ../../node_modules/.bin/vp test run src/lib/syntaxHighlighting.test.ts src/components/pullRequest/pullRequestDetail.logic.test.ts src/components/chat/nativeUsageCost.logic.test.ts 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/release/web-cache-tests.log"
      - name: Validate terminal client recovery
        shell: bash
        run: |
          cd "$DIE_T3_SOURCE/packages/client-runtime"
          ../../node_modules/.bin/tsc --noEmit 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/release/terminal-client-typecheck.log"
          ../../node_modules/.bin/vp test run src/rpc/client.test.ts src/state/terminalSession.test.ts 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/release/terminal-client-tests.log"
      - name: Create checksums and source information
        shell: bash
        run: |
          cd dist/release
          sha256sum die-linux-x64 > die-linux-x64.sha256
          sha256sum die-linux-arm64 > die-linux-arm64.sha256
          sha256sum die-darwin-arm64 > die-darwin-arm64.sha256
          sha256sum die-android-arm64 > die-android-arm64.sha256
          cp ../../LICENSE ../../THIRD_PARTY_NOTICES.md .
          t3_revision=$(bun -e 'console.log(require("../../web/t3-source.json").revision)')
          patch_sha256=$(sha256sum ../../web/t3.patch | awk '{print $1}')
          printf 'Source: https://github.com/%s/tree/%s\nCommit: %s\nTag: %s\nTargets:\n- bun-linux-x64-baseline -> die-linux-x64\n- bun-linux-arm64 -> die-linux-arm64\n- bun-darwin-arm64 -> die-darwin-arm64\n- bun-android-arm64 -> die-android-arm64\n\nEmbedded T3 Code source: https://github.com/pingdotgg/t3code/tree/%s\nRevision: %s\nPatch: web/t3.patch\nPatch-SHA256: %s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_REF_NAME" \
            "$t3_revision" "$t3_revision" "$patch_sha256" > SOURCE.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            dist/release/die-linux-x64 \
            dist/release/die-linux-x64.sha256 \
            dist/release/die-linux-arm64 \
            dist/release/die-linux-arm64.sha256 \
            dist/release/die-darwin-arm64 \
            dist/release/die-darwin-arm64.sha256 \
            dist/release/die-android-arm64 \
            dist/release/die-android-arm64.sha256 \
            dist/release/LICENSE \
            dist/release/THIRD_PARTY_NOTICES.md \
            dist/release/THIRD_PARTY_LICENSES.txt \
            dist/release/SOURCE.txt
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-failure-logs
          path: artifacts/release/
          if-no-files-found: warn
          retention-days: 14
