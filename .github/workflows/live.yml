name: Native Live
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "native/live/**"
      - "scripts/build-live-helper.sh"
      - ".github/workflows/live.yml"
permissions:
  contents: read
jobs:
  macos-helper:
    name: macOS native helper (no devices)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test bounded audio rings
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined native/live/AudioCore.c native/live/test-core.c -o /tmp/live-core-test
          /tmp/live-core-test
      - name: Compile Apple voice-processing helper and self-test
        run: sh scripts/build-live-helper.sh
      - name: Device-free protocol smoke
        run: |
          dist/live-audio --help
          printf '{"type":"stop"}\n' | dist/live-audio
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-audio-macos-arm64
          path: dist/live-audio
          if-no-files-found: error
          retention-days: 7
